# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%I : %M") </big></b>"
    color =rgb(a6adc8) 
    font_size = 350
    font_family = SF Pro Display Bold
    shadow_passes = 3
    shadow_size = 4

    position = 0, 150
    halign = center
    valign = center
}

# AM/PM
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%S %p") </big></b>"
    color =rgb(a6adc8) 
    font_size = 112
    font_family = SF Pro Display Bold
    shadow_passes = 3
    shadow_size = 4

    position = 0, -190
    halign = center
    valign = center
}


# -------- DATE --------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 15
    font_family = Geist Mono 10
    color = rgb(a6adc8)
    position = 0, 130
    halign = center
    valign = bottom
}
# Degrees
label {
    monitor =
    text = cmd[update:18000000] echo "<b>Feels like<big> $(curl -s 'wttr.in?format=%t' | tr -d '+') </big></b>"
    color = rgb(a6adc8)
    font_size = 15
    font_family = Geist Mono 10
    position = 0, 70
    halign = center
    valign = bottom
}
